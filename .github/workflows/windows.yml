name: Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
      WINEDEBUG: -all
      WINEARCH: win64
      WINEPREFIX: ${{ github.workspace }}/.build/wine
      XWIN_ARCH: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm lld cmake ninja-build wine wine64 xvfb xauth pkg-config
          python -m pip install cargo-xwin==0.23.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.99.0'
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Prepare GPUI and shader compiler
        run: |
          python scripts/bootstrap.py
          python scripts/setup_fxc.py
          chmod +x scripts/fxc-wine.py
          echo "GPUI_FXC_PATH=$GITHUB_WORKSPACE/scripts/fxc-wine.py" >> "$GITHUB_ENV"
          xvfb-run -a wineboot -u
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint including complexity
        run: xvfb-run -a cargo xwin clippy --locked --release --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Run Windows unit tests
        run: xvfb-run -a cargo xwin test --locked --release --lib --target x86_64-pc-windows-msvc
      - name: Build Windows executables
        run: xvfb-run -a cargo xwin build --locked --release --bins --target x86_64-pc-windows-msvc
      - name: Package binaries, licenses and sources
        run: python scripts/package.py target/x86_64-pc-windows-msvc/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raiju-bridge-windows-x64
          path: |
            dist/raiju-bridge-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
