name: Windows

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
      WINEDEBUG: -all
      WINEARCH: win64
      WINEPREFIX: ${{ github.workspace }}/.build/wine
      XWIN_ARCH: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm lld cmake ninja-build wine wine64 xvfb xauth pkg-config
          python -m pip install cargo-xwin==0.23.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.99.0'
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Cache cross-build dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/cargo-xwin
            .build/fxc
            .build/gpui
            target
          key: windows-x64-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/bootstrap.py', 'scripts/setup_fxc.py', '.cargo/config.toml') }}
      - name: Prepare GPUI and shader compiler
        run: |
          python scripts/bootstrap.py
          python scripts/setup_fxc.py
          chmod +x scripts/fxc-wine.py
          echo "GPUI_FXC_PATH=$GITHUB_WORKSPACE/scripts/fxc-wine.py" >> "$GITHUB_ENV"
          xvfb-run -a wineboot -u
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint including complexity
        run: xvfb-run -a cargo xwin clippy --locked --release --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Run Windows unit tests
        run: xvfb-run -a cargo xwin test --locked --release --lib --target x86_64-pc-windows-msvc
      - name: Build Windows executables
        run: xvfb-run -a cargo xwin build --locked --release --bins --target x86_64-pc-windows-msvc
      - name: Package binaries, licenses and sources
        run: python scripts/package.py target/x86_64-pc-windows-msvc/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raiju-bridge-windows-x64
          path: |
            dist/raiju-bridge-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  release:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raiju-bridge-windows-x64
          path: dist
      - name: Publish release downloads
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" raiju-bridge-windows-x64.zip SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" raiju-bridge-windows-x64.zip SHA256SUMS.txt \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
